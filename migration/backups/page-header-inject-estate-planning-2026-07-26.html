        "@type": "Answer",
        "text": "Estate planning is the process of arranging for the management and distribution of your assets during your lifetime and after death. In Puerto Rico, estate planning is governed by civil law, which includes forced heirship rules (legitima) that reserve a portion of your estate for certain heirs. Proper planning helps minimize taxes, avoid lengthy probate, and ensures your wishes are carried out."

      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Under Puerto Rico Civil Code, forced heirship (legitima) reserves two-thirds of your estate for forced heirs, typically children or descendants. The remaining one-third can be distributed according to your wishes. This differs from most U.S. states which allow complete freedom of testation."
